<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/game.css"><title>Recipe Hub - Welcome</title></head>
<body><section class="land"><div>
  <p class="kick">Welcome to Recipe Hub</p>
  <h1>From your pantry to the <em>table</em></h1>
  <p>Browse international recipes, cook on a budget, and play the pantry game.</p>
  <form class="pill" id="f"><input id="q" placeholder="What are you craving? (chicken, pasta...)"><button id="go">Get started</button></form>
</div></section>
<script>
  const loggedIn = !!localStorage.getItem("rp_token");
  if (loggedIn) document.getElementById("go").textContent = "Open the kitchen";
  document.getElementById("f").onsubmit = e => { e.preventDefault(); location.href = loggedIn ? "pages/home.html" : "pages/login.html"; };
</script></body></html>
