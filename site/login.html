<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
<style>
 body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#fde3d9,#fff 60%);display:grid;place-items:center;min-height:100vh;margin:0;color:#1b1b1b}
 form{background:#fff;padding:34px;border-radius:14px;width:min(380px,92vw);box-shadow:0 20px 50px #0002;display:grid;gap:12px;animation:up .6s both}
 @keyframes up{from{opacity:0;transform:translateY(22px)}}
 .logo{font:800 1.8rem "Playfair Display",serif;text-align:center}.logo em{color:#ff6a3d}
 h2{margin:0;text-align:center;font:600 1.1rem Inter;color:#6f6f6f}
 input,button{padding:12px;font:inherit;border-radius:8px;border:1px solid #e0e0e0}
 input:focus{outline:2px solid #ff6a3d;border-color:transparent}
 button{background:#ff6a3d;color:#fff;border:0;font-weight:600;cursor:pointer;transition:filter .2s,transform .15s}
 button:hover{filter:brightness(.92)}button:active{transform:scale(.97)}
 a{font-size:.9rem;text-align:center;color:#6f6f6f;cursor:pointer}a:hover{color:#1b1b1b}
 #msg{font-size:.9rem;min-height:1.2em;color:#b3261e}
 @media(prefers-reduced-motion:reduce){form{animation:none}}
</style></head><body>
<form id="f">
  <div class="logo">Recipe <em>Hub</em></div>
  <h2 id="title">Log in</h2>
  <input id="name" placeholder="Your name" style="display:none">
  <input id="email" type="email" placeholder="Email" required>
  <input id="password" type="password" placeholder="Password (min 6 characters)" required minlength="6">
  <button id="go">Log in</button>
  <div id="msg"></div>
  <a id="toggle">No account yet? Register</a>
</form>
<script>
let registering = false;
const $ = id => document.getElementById(id);
if (localStorage.getItem("rp_token")) location.replace("/");

$("toggle").onclick = () => {
  registering = !registering;
  $("title").textContent = $("go").textContent = registering ? "Register" : "Log in";
  $("name").style.display = registering ? "block" : "none";
  $("toggle").textContent = registering ? "Have an account? Log in" : "No account yet? Register";
  $("msg").textContent = "";
};

$("f").onsubmit = async e => {
  e.preventDefault();
  $("msg").style.color = "#b3261e"; $("msg").textContent = "";
  const payload = { email: $("email").value, password: $("password").value, name: $("name").value };
  try {
    let res = await fetch(registering ? "/api/auth/register" : "/api/auth/login",
      { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    let data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Something went wrong");
    if (registering) {
      $("toggle").click();
      $("msg").style.color = "#2e7d32"; $("msg").textContent = data.message;
      return;
    }
    localStorage.setItem("rp_token", data.access_token);
    localStorage.setItem("rp_user", JSON.stringify(data.user));
    location.href = "/";
  } catch (err) { $("msg").textContent = err.message; }
};
</script></body></html>
