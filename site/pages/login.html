<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css"><link rel="stylesheet" href="../css/game.css"><title>Log in</title></head>
<body><div class="login"><form id="f">
  <a class="logo" href="../index.html">Recipe <em>Hub</em></a>
  <h2 id="title">Welcome back, log in</h2>
  <input id="name" placeholder="Your name" hidden>
  <input id="email" type="email" placeholder="Email" required>
  <input id="password" type="password" placeholder="Password (min 6 characters)" required minlength="6">
  <button class="btn" id="go">Log in</button>
  <div class="msg" id="msg"></div>
</form></div>
<script>
  const $ = id => document.getElementById(id);
  let signup = false;
  if (localStorage.getItem("rp_token")) location.replace("home.html");
  function mode(on) {
    signup = on;
    $("title").textContent = on ? "Create your account" : "Welcome back, log in";
    $("go").textContent = on ? "Register" : "Log in";
    $("name").hidden = !on; $("msg").textContent = "";
    $("toggle").textContent = on ? "Have an account? Log in" : "No account yet? Register";
  }
  $("toggle").onclick = () => mode(!signup);
  $("f").onsubmit = async e => {
    e.preventDefault(); $("msg").className = "msg"; $("msg").textContent = ""; $("go").disabled = true;
    try {
      const res = await fetch(signup ? "/api/auth/register" : "/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: $("email").value, password: $("password").value, name: $("name").value }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || "Something went wrong");
      if (signup) { mode(false); $("msg").className = "msg ok"; $("msg").textContent = data.message; }
      else { localStorage.setItem("rp_token", data.access_token); localStorage.setItem("rp_user", JSON.stringify(data.user)); location.href = "home.html"; }
    } catch (err) { $("msg").textContent = err.message; }
    $("go").disabled = false;
  };
</script></body></html>
