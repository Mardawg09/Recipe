<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css"><link rel="stylesheet" href="../css/game.css"><title>Pantry Roulette</title></head>
<body>
<main class="wrap">
  <section class="band rv" style="margin-top:28px"><h2>Guess the ingredients, cook the recipe.</h2><p style="margin:0;color:var(--mut)">Pick a level, read the order, and choose the right ingredients from a shuffled pantry.</p></section>
  <h2 class="sec rv">Choose a level</h2><div class="g3" id="levels">Loading...</div>
  <section id="board" hidden><h2 class="sec">Your order</h2>
    <div class="ticket"><span class="tag" id="tCuisine"></span><h3 id="tName"></h3><p id="tDesc"></p><p class="need">Pick exactly <b id="tNeeds"></b> ingredients from the shuffled pantry.</p></div>
    <div id="pantry" class="pantry"></div>
    <div class="actions"><button id="cookBtn" type="button" class="btn">Cook it!</button><button id="newBtn" type="button" class="btn ghost">New random order</button><span id="picked">0 selected</span></div>
    <p id="feedback" role="status"></p></section>
</main>
<script src="../js/auth.js"></script><script src="../js/common.js"></script><script src="../js/pages/game.js"></script>
</body></html>
